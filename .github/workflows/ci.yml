name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.1", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium
      - name: Lint
        run: find plugin tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Unit tests
        run: php tests/run.php
